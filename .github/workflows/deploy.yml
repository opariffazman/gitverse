name: Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Get version info
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          if echo "$CURRENT" | grep -q '\-rc\.'; then
            STABLE=$(echo "$CURRENT" | sed 's/-rc\.[0-9]*//')
            echo "stable=$STABLE" >> $GITHUB_OUTPUT
            echo "is_rc=true" >> $GITHUB_OUTPUT
          else
            echo "is_rc=false" >> $GITHUB_OUTPUT
          fi
      - name: Bump to stable version
        if: steps.version.outputs.is_rc == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- package-lock.json
          npm version ${{ steps.version.outputs.stable }}
          git push --follow-tags
      - name: Build
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.is_rc == 'true'
        run: npm run build
      - name: Deploy to GitHub Pages
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.is_rc == 'true'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: dist
          clean-exclude: pr-preview
